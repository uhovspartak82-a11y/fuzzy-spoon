name: Fetch menu photos
on:
  push:
    paths: [".github/menu-photos.txt", ".github/menu-samples.txt", ".github/workflows/menu-photos.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert to webp
        run: |
          sudo apt-get install -y webp >/dev/null
          mkdir -p img/menu/gen
          while read -r idx url; do
            curl -fsSL --retry 3 "$url" -o /tmp/p.png
            cwebp -quiet -q 78 -resize 640 640 /tmp/p.png -o "img/menu/gen/d$idx.webp"
          done < .github/menu-photos.txt
          # Trial photos for approval, not used by the page
          if [ -f .github/menu-samples.txt ]; then
            mkdir -p img/menu/samples
            while read -r name url; do
              curl -fsSL --retry 3 "$url" -o /tmp/p.png
              cwebp -quiet -q 78 -resize 640 640 /tmp/p.png -o "img/menu/samples/$name.webp"
            done < .github/menu-samples.txt
          fi
          ls img/menu/gen | wc -l
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A img/menu
          git commit -m "Add generated menu photos" || exit 0
          git push
