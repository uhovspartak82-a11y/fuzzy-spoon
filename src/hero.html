<style>
/* Layout: asymmetric split. Text left, one real venue photo bleeding off the right edge; photo on top on phones. One look only: the lounge at night. */
:root {
  --bg: #151416;
  --surface: #201e21;
  --fg: #f3eee6;
  --muted: #b3aca3;
  --accent: #f4b860;      /* warm glow of the neon cloud sign */
  --accent-ink: #1b1508;
  --line: rgba(243, 238, 230, .12);
  --font-display: "Pangolin", "Comic Sans MS", cursive;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }

/* Navigation */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 68px; }
.brand { font-family: var(--font-display); font-size: 1.5rem; text-decoration: none; letter-spacing: .01em; white-space: nowrap; }
.nav ul { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; }
.nav ul a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: .95rem; transition: color .2s; }
.nav ul a:hover, .nav ul a:focus-visible { color: var(--fg); }
.nav-phone { font-weight: 700; text-decoration: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nav-phone:hover { color: var(--accent); }

/* Hero: text on the dark left, one photo bleeding off the right edge and fading into the background */
.hero { position: relative; overflow: hidden; }
.hero .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; min-height: min(760px, calc(100dvh - 68px)); padding-block: clamp(40px, 7vw, 88px); }
.hero-copy { min-width: 0; }
.hero-media { position: absolute; inset: 0 0 0 auto; width: 54%; margin: 0; }
.hero-media img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 0% 46%; }
.hero-media::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgb(21 20 22) 0%, rgb(21 20 22 / .7) 3%, rgb(21 20 22 / .35) 7%, rgb(21 20 22 / .12) 11%, rgb(21 20 22 / 0) 15%), linear-gradient(0deg, rgb(21 20 22) 0%, rgb(21 20 22 / .6) 10%, rgb(21 20 22 / 0) 30%), linear-gradient(180deg, rgb(21 20 22 / .5) 0%, rgb(21 20 22 / 0) 18%); }
.smoke { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; mix-blend-mode: screen; }
.hours { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 22px; color: var(--muted); font-size: .9rem; letter-spacing: .02em; }
.hours strong { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(3.4rem, 9vw, 7rem); line-height: .95; margin: 0 0 24px; text-wrap: balance; }
h1 .want { color: var(--accent); display: inline-block; transform: rotate(-3deg); }
.lead { font-size: clamp(1.05rem, 1.6vw, 1.2rem); color: var(--muted); max-width: 36ch; margin: 0 0 36px; }
.ctas { display: flex; flex-wrap: wrap; gap: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: 1rem; text-decoration: none; white-space: nowrap; transition: transform .15s, background-color .2s, border-color .2s; }
.btn:active { transform: translateY(1px) scale(.98); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: #f7c97f; }
.btn-ghost { border: 1.5px solid var(--line); color: var(--fg); }
.btn-ghost:hover { border-color: var(--accent); }
.btn:focus-visible, .nav a:focus-visible, .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .8s cubic-bezier(.16, 1, .3, 1) both; }
  .d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .24s; }
  .hero-media img { animation: fade 1.4s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: scale(1.04); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
}

@media (max-width: 900px) {
  .nav ul { display: none; }
  .hero .wrap { grid-template-columns: 1fr; min-height: 0; padding-block: 0 48px; }
  .hero-media { position: relative; inset: auto; width: auto; height: 92vw; max-height: 560px; }
  .hero-media img { object-position: 0% 50%; }
  .hero-media::after { background: linear-gradient(0deg, rgb(21 20 22) 0%, rgb(21 20 22 / .75) 8%, rgb(21 20 22 / .35) 16%, rgb(21 20 22 / 0) 26%); }
}
@media (max-width: 420px) {
  .btn { flex: 1 1 100%; }
  .nav-phone { font-size: .9rem; }
}
</style>

<script>
/* Hookah smoke: soft puffs rise from the bowl in the photo and drift across the hero. Static frame for reduced motion. */
(function () {
  var hero = document.querySelector('.hero'), cv = hero && hero.querySelector('.smoke'), img = hero && hero.querySelector('.hero-media img');
  if (!cv || !img || !cv.getContext) return;
  var ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, src = { x: 0, y: 0, s: 1 }, puffs = [], last = 0;
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BOWL = { x: 0.31, y: 0.235 };               /* bowl position inside the photo, as a share of its width and height */
  function fit() {
    var r = hero.getBoundingClientRect(), m = img.getBoundingClientRect();
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var iw = img.naturalWidth || 1100, ih = img.naturalHeight || 1465, sc = Math.max(m.width / iw, m.height / ih);
    var pos = getComputedStyle(img).objectPosition.split(' ').map(function (v) { return parseFloat(v) / 100; });
    var ox = (m.width - iw * sc) * (isNaN(pos[0]) ? .5 : pos[0]), oy = (m.height - ih * sc) * (isNaN(pos[1]) ? .5 : pos[1]);
    src.x = m.left - r.left + ox + BOWL.x * iw * sc; src.y = m.top - r.top + oy + BOWL.y * ih * sc; src.s = Math.max(.6, Math.min(1.4, sc * iw / 700));
  }
  function spawn(age) {
    puffs.push({ x: src.x + (Math.random() - .5) * 14 * src.s, y: src.y, vx: (Math.random() - .62) * .7, vy: -(.16 + Math.random() * .22),
      r: (14 + Math.random() * 16) * src.s, g: .32 + Math.random() * .3, a: 0, life: 0, max: 420 + Math.random() * 260, wob: Math.random() * 6.28 });
    var p = puffs[puffs.length - 1]; if (age) { for (var i = 0; i < age; i++) step(p, 1); }
  }
  function step(p, dt) {
    p.life += dt; p.wob += .012 * dt;
    p.x += (p.vx + Math.sin(p.wob) * .45) * dt; p.y += p.vy * dt; p.vy *= .998; p.vx *= 1.001; p.r += p.g * dt;
    var t = p.life / p.max; p.a = t < .15 ? t / .15 : Math.max(0, 1 - (t - .15) / .85);
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i], g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, 'rgba(255, 236, 214,' + (.06 * p.a) + ')'); g.addColorStop(1, 'rgba(255, 236, 214, 0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
  }
  function tick(now) {
    var dt = Math.min(3, (now - (last || now)) / 16.7); last = now;
    if (Math.random() < .3 * dt) spawn(0);
    for (var i = puffs.length - 1; i >= 0; i--) { step(puffs[i], dt); if (puffs[i].life > puffs[i].max) puffs.splice(i, 1); }
    draw(); if (running) requestAnimationFrame(tick);
  }
  var running = false;
  function start() { fit(); puffs = []; for (var i = 0; i < 70; i++) spawn(Math.random() * 600); draw(); if (!still && !running) { running = true; requestAnimationFrame(tick); } }
  if (img.complete) start(); else img.addEventListener('load', start);
  window.addEventListener('resize', fit);
  if ('IntersectionObserver' in window && !still) new IntersectionObserver(function (e) {
    if (e[0].isIntersecting) { if (!running) { running = true; last = 0; requestAnimationFrame(tick); } } else running = false;
  }).observe(hero);
})();
</script>
