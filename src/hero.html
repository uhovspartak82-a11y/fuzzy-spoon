/* Layout: asymmetric split. Text left, one real venue photo bleeding off the right edge; photo on top on phones. One look only: the lounge at night. */
:root {
  --bg: #151416;
  --surface: #201e21;
  --fg: #f3eee6;
  --muted: #b3aca3;
  --accent: #f4b860;      /* warm glow of the neon cloud sign */
  --accent-ink: #1b1508;
  --line: rgba(243, 238, 230, .12);
  --font-display: "Pangolin", "Comic Sans MS", cursive;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }

/* Navigation */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 68px; }
.brand { font-family: var(--font-display); font-size: 1.5rem; text-decoration: none; letter-spacing: .01em; white-space: nowrap; }
.nav ul { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; }
.nav .menu-cta { display: none; }
.nav ul a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: .95rem; transition: color .2s; }
.nav ul a:hover, .nav ul a:focus-visible { color: var(--fg); }
.nav-phone { font-weight: 700; text-decoration: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nav-phone:hover { color: var(--accent); }

/* Hero: text on the dark left, one photo bleeding off the right edge and fading into the background */
.hero { position: relative; overflow: hidden; }
.hero .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; min-height: min(760px, calc(100dvh - 68px)); padding-block: clamp(40px, 7vw, 88px); }
.hero-copy { min-width: 0; }
.hero-media { position: absolute; inset: 0 0 0 auto; width: 58%; margin: 0; }
.hero-media img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 0% 46%; }

.smoke { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.hours { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 22px; color: var(--muted); font-size: .9rem; letter-spacing: .02em; }
.hours strong { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(3.4rem, 9vw, 7rem); line-height: .95; margin: 0 0 24px; text-wrap: balance; }
h1 .want { color: var(--accent); display: inline-block; transform: rotate(-3deg); }
.lead { font-size: clamp(1.05rem, 1.6vw, 1.2rem); color: var(--muted); max-width: 36ch; margin: 0 0 36px; }
.ctas { display: flex; flex-wrap: wrap; gap: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: 1rem; text-decoration: none; white-space: nowrap; transition: transform .15s, background-color .2s, border-color .2s; }

.btn-primary { background: var(--accent); color: var(--accent-ink); }

/* Mobile: burger menu panel and a bottom bar with call / route */
.burger { display: none; position: relative; width: 48px; height: 48px; margin-right: -10px; border: 0; background: none; color: var(--fg); cursor: pointer; }
.burger span { position: absolute; left: 13px; right: 13px; height: 2px; border-radius: 2px; background: currentColor; transition: transform .25s, opacity .2s; }
.burger span:nth-child(1) { top: 17px; } .burger span:nth-child(2) { top: 23px; } .burger span:nth-child(3) { top: 29px; }

.nav.open .burger span:nth-child(2) { opacity: 0; }
.nav.open .burger span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
.burger:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 10px; }
.mbar { display: none; }

@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .8s cubic-bezier(.16, 1, .3, 1) both; }
  .d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .24s; }
  .hero-media img { animation: fade 1.4s ease-out both; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
}

  .nav ul { flex-direction: column; gap: 0; }

  .mbar { display: flex; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); transform: translateY(110%); transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
  .mbar.show { transform: none; }
  .mbar .btn { flex: 1 1 0; min-height: 48px; padding: 0 12px; }
  body { padding-bottom: 76px; }
  .hero .wrap { grid-template-columns: 1fr; min-height: 0; padding-block: 0 48px; }
  .hero-media { position: relative; inset: auto; width: auto; height: 92vw; max-height: 560px; }
  .hero-media img { object-position: 0% 50%; }
  .hero-media { -webkit-mask-image: linear-gradient(0deg, transparent 0%, rgb(0 0 0 / .45) 9%, rgb(0 0 0 / .85) 18%, #000 26%); mask-image: linear-gradient(0deg, transparent 0%, rgb(0 0 0 / .45) 9%, rgb(0 0 0 / .85) 18%, #000 26%); }
}
@media (max-width: 420px) {
  .btn { flex: 1 1 100%; }
  .nav-phone { font-size: .9rem; }
}

/* Hookah smoke: slow, light fog creeping across the whole hero (WebGL noise). One still frame for reduced motion. */
(function () {
  var hero = document.querySelector('.hero'), cv = hero && hero.querySelector('.smoke');
  if (!cv) return;
  var gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  if (!gl) { cv.remove(); return; }
  var vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs = [
    '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif',
    'uniform vec2 r;uniform float t;',
    'float h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}',
    'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    'return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){v+=a*n(p);p=m*p;a*=.5;}return v;}',
    'void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=vec2(uv.x*r.x/r.y,uv.y)*2.2;',
    'vec2 q=vec2(fbm(p+vec2(t*.05,-t*.02)),fbm(p+vec2(5.2,1.3)-vec2(t*.03,t*.015)));',
    'float d=fbm(p+2.4*q+vec2(-t*.04,-t*.025));',
    'd=smoothstep(.42,.95,d);',
    'float fall=mix(1.,.45,smoothstep(.0,1.,uv.y));',
    'float a=d*fall*(r.x<r.y?.65:.5);',
    'vec3 c=mix(vec3(.95,.9,.84),vec3(1.,.86,.66),q.x);',
    'gl_FragColor=vec4(c*a,a);}'
  ].join('\n');
  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { cv.remove(); return; }
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var uR = gl.getUniformLocation(pr, 'r'), uT = gl.getUniformLocation(pr, 't');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches, on = true, raf = 0, t0 = performance.now();
  function size() {
    var s = 0.5, w = Math.max(1, Math.round(cv.clientWidth * s)), h = Math.max(1, Math.round(cv.clientHeight * s));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
    gl.uniform2f(uR, w, h);
  }
  function draw(now) {
    gl.uniform1f(uT, 20 + (now - t0) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!still && on) raf = requestAnimationFrame(draw);
  }
  size(); draw(t0);
  window.addEventListener('resize', function () { size(); if (still) draw(performance.now()); });
  if ('IntersectionObserver' in window) new IntersectionObserver(function (e) {
    on = e[0].isIntersecting; cancelAnimationFrame(raf); if (on && !still) raf = requestAnimationFrame(draw);
  }).observe(hero);
})();
</script>
